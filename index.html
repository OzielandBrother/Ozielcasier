<link rel="apple-touch-icon" href="icon-192.png">

<style>
/* Layout: header + tab bar on top; Kasir is catalog (left) + cart (right), collapsing to one column with a bottom total bar on phones. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#E4E9F0; --line:#CAD2DD;
  --fg:#131F2E; --muted:#54647A;
  --accent:#C2342C; --accent-fg:#FFFFFF; --navy:#1E3A5F;
  --good:#1C7448; --warn:#9A5B08; --bad:#B3261E;
  --silver:#5F6C7D; --gold:#8C6208; --focus:#1E3A5F;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1520; --surface:#162030; --surface2:#1E2B3F; --line:#2C3C54;
    --fg:#E8EDF4; --muted:#9DABBE;
    --accent:#D9453C; --accent-fg:#FFFFFF; --navy:#8DB0E0;
    --good:#4CC38A; --warn:#E0A042; --bad:#F2796F;
    --silver:#A9B5C4; --gold:#E2B34F; --focus:#8DB0E0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1520; --surface:#162030; --surface2:#1E2B3F; --line:#2C3C54;
  --fg:#E8EDF4; --muted:#9DABBE;
  --accent:#D9453C; --accent-fg:#FFFFFF; --navy:#8DB0E0;
  --good:#4CC38A; --warn:#E0A042; --bad:#F2796F;
  --silver:#A9B5C4; --gold:#E2B34F; --focus:#8DB0E0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 32px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;font-family:var(--f-display);font-weight:700;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
h2{font-size:19px}
h3{font-size:16px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.wrap{max-width:1180px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:18px 10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.pole{width:14px;height:44px;border:2px solid var(--fg);border-radius:7px;flex:none;
  background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,var(--surface) 6px 12px,var(--navy) 12px 18px,var(--surface) 18px 24px)}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:30px;letter-spacing:.08em;line-height:1}
.brand-sub{font-size:13px;color:var(--muted);letter-spacing:.04em}
.status{font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:4px;background:var(--surface);display:inline-flex;align-items:center;gap:7px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok::before{background:var(--good)}
.status.warn::before{background:var(--warn)}
.status.bad::before{background:var(--bad)}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:2px solid var(--line);margin-bottom:18px}
.tabs a{font-family:var(--f-display);font-weight:600;font-size:18px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;color:var(--muted);padding:10px 16px;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--fg);border-bottom-color:var(--accent)}
.tabs a:hover{color:var(--fg)}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center}
.between{justify-content:space-between}
.wrapx{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 14px;font-weight:600;min-height:40px}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.primary:disabled{background:var(--surface2);border-color:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:32px;padding:4px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--muted);text-decoration:underline;padding:4px 6px;min-height:0}
input[type=password],input[type=time],input[type=text],input[type=search],input[type=tel],input[type=date],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 11px;min-height:42px}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:5px 12px;font-size:14px;font-weight:500;min-height:34px}
.chip[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--fg);font-family:var(--f-display);font-size:20px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:4px}
.tier{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid currentColor}
.tier::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.tier.reguler{color:var(--muted)}
.tier.silver{color:var(--silver)}
.tier.gold{color:var(--gold)}
.bar{height:8px;background:var(--surface2);border-radius:2px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--navy)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0}
.kv.total{border-top:1px dashed var(--line);margin-top:6px;padding-top:10px;font-family:var(--f-display);font-size:26px;font-weight:700;letter-spacing:.03em}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:640px}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:600;padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
tr:last-child td{border-bottom:0}
.rowbtn{background:none;border:0;padding:0;text-align:left;font-weight:600;color:var(--navy);text-decoration:underline;text-underline-offset:3px}

/* kasir */
.kasir{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:16px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.tile{position:relative;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:12px;display:flex;flex-direction:column;gap:6px;min-height:92px}
.tile:hover{border-color:var(--navy)}
.tile .nm{font-family:var(--f-display);font-weight:700;font-size:19px;letter-spacing:.02em;line-height:1.1}
.tile .pr{font-weight:600}
.tile .tag{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .qty{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-fg);font-weight:600;font-size:13px;min-width:26px;text-align:center;padding:1px 7px;border-radius:12px}
.cart{position:sticky;top:12px}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.qtyctl{display:inline-flex;align-items:center;gap:4px}
.qtyctl button{width:32px;height:32px;border:1px solid var(--line);background:var(--surface);border-radius:4px;font-weight:600}
.qtyctl span{min-width:26px;text-align:center;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:8px 4px;font-weight:600;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--surface)}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.results{border:1px solid var(--line);border-radius:4px;margin-top:8px;overflow:hidden}
.results button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:var(--surface);border:0;border-bottom:1px solid var(--line);padding:10px 12px}
.results button:last-child{border-bottom:0}
.results button:hover{background:var(--surface2)}
.picked{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:12px}
.cartbar{display:none}

/* riwayat */
.sumgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.sum{padding:14px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.sum .lb{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sum .vl{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;margin-top:2px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.barrow{display:grid;gap:4px;margin-top:12px}

/* struk & modal */
.overlay{position:fixed;inset:0;background:rgba(8,13,20,.6);display:flex;align-items:center;justify-content:center;padding:16px max(16px, env(safe-area-inset-right, 0px)) 16px max(16px, env(safe-area-inset-left, 0px));z-index:20}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:6px;width:100%;max-width:460px;max-height:92vh;overflow:auto;padding:18px}
.struk{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;line-height:1.5;background:var(--bg);border:1px dashed var(--line);border-radius:4px;padding:14px;white-space:pre;overflow-x:auto;margin:12px 0}
.err{color:var(--bad);font-size:14px;margin:0}
#toast{position:fixed;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom, 0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:30}
#toast div{background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:4px;font-weight:500;max-width:90vw}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.mt{margin-top:12px}
.hint{font-size:13px;color:var(--muted)}

.qrow{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:12px 0;border-bottom:1px solid var(--line)}
.qrow:last-child{border-bottom:0}
.qno{font-family:var(--f-display);font-weight:700;font-size:24px;min-width:52px;line-height:1.1}
.tier.menunggu{color:var(--warn)}.tier.dilayani{color:var(--navy)}.tier.selesai{color:var(--good)}.tier.batal{color:var(--muted)}
@media (max-width: 900px){
  .kasir{grid-template-columns:minmax(0,1fr)}
  .cart{position:static}
  body{padding-bottom:84px}
  .cartbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:2px solid var(--accent);
    padding:10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    align-items:center;justify-content:space-between;gap:12px}
  .cartbar .tot{font-family:var(--f-display);font-size:24px;font-weight:700}
}
@media (prefers-reduced-motion: no-preference){
  .btn,.tile,.chip{transition:background-color .12s,border-color .12s}
}
</style>

<script>
(function(){
'use strict';

/* ---------- Konfigurasi toko ---------- */
var SHOP = 'Oziel and Brother';
var KAPSTER = ['Ozi','Dhana','Yosep','Kasirin','Revan'];
var CATALOG = [
  {id:'haircut', hargaMember:35000,      nama:'Haircut',          harga:50000,  jenis:'layanan', grup:'Haircut'},
  {id:'kids-haircut', nama:'Kids Haircut',     harga:40000,  jenis:'layanan', grup:'Haircut'},
  {id:'wash',         nama:'Wash',             harga:10000,  jenis:'layanan', grup:'Haircut'},
  {id:'shaving',      nama:'Shaving',          harga:20000,  jenis:'layanan', grup:'Haircut'},
  {id:'styling',      nama:'Styling',          harga:15000,  jenis:'layanan', grup:'Haircut'},
  {id:'coverage',     nama:'Coverage / Semir', harga:60000,  jenis:'layanan', grup:'Treatment'},
  {id:'scrub',        nama:'Scrub',            harga:30000,  jenis:'layanan', grup:'Treatment'},
  {id:'mask',         nama:'Mask',             harga:25000,  jenis:'layanan', grup:'Treatment'},
  {id:'perm-start', mulai:true,   nama:'Perm Start',       harga:200000, jenis:'layanan', grup:'Treatment'},
  {id:'curly',        nama:'Curly',            harga:200000, jenis:'layanan', grup:'Treatment'},
  {id:'coloring', mulai:true,     nama:'Coloring Start',   harga:300000, jenis:'layanan', grup:'Treatment'},
  {id:'hairtonic',    nama:'Hair Tonic',       harga:30000,  jenis:'produk',  grup:'Produk'},
  {id:'pomade',       nama:'Pomade',           harga:50000,  jenis:'produk',  grup:'Produk'},
  {id:'pomade-mini',  nama:'Pomade Mini',      harga:30000,  jenis:'produk',  grup:'Produk'},
  {id:'member-tahunan', nama:'Member 1 Tahun',  harga:1000000, jenis:'produk', grup:'Membership', per:'tahun'}
];
var CAT = {}; CATALOG.forEach(function(c){ CAT[c.id]=c; });
var TIERS = [
  {key:'reguler', nama:'Reguler', min:0,       diskon:0},
  {key:'silver',  nama:'Silver',  min:500000,  diskon:5},
  {key:'gold',    nama:'Gold',    min:1500000, diskon:10}
];
var POIN_PER = 1000;      // 1 poin setiap Rp 1.000 yang dibayar
var TUKAR_POIN = 100;     // tukar per kelipatan 100 poin
var TUKAR_NILAI = 5000;   // senilai potongan Rp 5.000
var METODE = [{k:'tunai',n:'Tunai'},{k:'qris',n:'QRIS'},{k:'transfer',n:'Transfer'}];
var PENGELUAR = ['KASIR'].concat(KAPSTER);
var KATEGORI = ['Gaji & bagi hasil','Sewa tempat','Listrik & air','Belanja produk','Peralatan','Makan & minum','Lainnya'];
var VA = [
  {k:'kasir',    n:'Kasir'},
  {k:'antrean',  n:'Antrean'},
  {k:'libur',    n:'Libur'},
  {k:'member',   n:'Member'},
  {k:'riwayat',  n:'Riwayat'},
  {k:'pengeluaran', n:'Pengeluaran'},
  {k:'cek-poin', n:'Cek Poin'}
];
var VC = [{k:'antrean', n:'Antrean'},{k:'menu', n:'Menu & Harga'}];
var VIEWS = VC;

/* ---------- Util ---------- */
var nf = new Intl.NumberFormat('id-ID');
function rp(n){ return (n<0?'-':'') + 'Rp ' + nf.format(Math.abs(Math.round(n))); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function pad2(n){ return String(n).padStart(2,'0'); }
var BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
function fmtTgl(iso){ var d=new Date(iso); return d.getDate()+' '+BLN[d.getMonth()]+' '+d.getFullYear(); }
function fmtWaktu(iso){ var d=new Date(iso); return fmtTgl(iso)+', '+pad2(d.getHours())+'.'+pad2(d.getMinutes()); }
function dayKey(d){ d=new Date(d); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function normHp(s){
  var d = String(s||'').replace(/\D/g,'');
  if(d.indexOf('62')===0) d = '0'+d.slice(2);
  else if(d && d.charAt(0)!=='0') d = '0'+d;
  return d;
}
function hpOk(id){ return /^0\d{8,13}$/.test(id); }
function tierOf(total){ for(var i=TIERS.length-1;i>=0;i--){ if(total>=TIERS[i].min) return TIERS[i]; } return TIERS[0]; }
function nextTier(total){ for(var i=0;i<TIERS.length;i++){ if(TIERS[i].min>total) return TIERS[i]; } return null; }
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function sum(arr,f){ return arr.reduce(function(a,x){ return a+f(x); },0); }
function tierBadge(t){ return '<span class="tier '+t.key+'">'+t.nama+'</span>'; }

/* ---------- State ---------- */
var S = {
  mode:'loading', loading:true, slow:false, dbErr:null,
  view:'kasir', filter:'semua',
  members:{}, trx:[], exp:[], ex:{tgl:dayKey(new Date()), kategori:'Gaji & bagi hasil', oleh:'', ket:'', jumlah:''},
  cart:{items:{}, hargaIn:{}, memberId:null, kapster:KAPSTER[0], metode:'tunai', tukar:0, bayar:''},
  mq:'', ml:'', cek:'', range:'hari',
  libur:[], lf:{kapster:KAPSTER[0], mulai:dayKey(new Date()), selesai:dayKey(new Date()), ket:''}, lErr:'', trxTgl:dayKey(new Date()), mf:{nama:'',jumlah:''}, mErr:'', canInstall:false, role:'customer', auth:{email:'',pass:''}, authErr:'', pub:[],
  qKap:'', q:[], qDate:dayKey(new Date()), qf:{nama:'', hp:'', kapster:'', ket:'', jam:''}, qErr:'',
  modal:null, form:{}, formErr:'', exErr:'', saving:false, focusModal:false
};
var db = null;

/* ---------- Penyimpanan ---------- */
function lsGet(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
function loadLocal(){ S.members = lsGet('rb_members') || {}; S.trx = lsGet('rb_trx') || []; S.exp = lsGet('rb_exp') || []; S.q = lsGet('rb_q') || []; S.libur = lsGet('rb_libur') || []; S.loading=false; }
function persistLocal(){ lsSet('rb_members',S.members); lsSet('rb_trx',S.trx); lsSet('rb_exp',S.exp); lsSet('rb_q',S.q); lsSet('rb_libur',S.libur); }
function clone(o){ return JSON.parse(JSON.stringify(o)); }

function putMember(m){
  var c = clone(m);
  if(db) return tmo(db.collection('members').doc(c.id).set(c));
  S.members[c.id]=c; persistLocal(); return Promise.resolve();
}
function delMember(id){
  if(db) return db.collection('members').doc(id).delete();
  delete S.members[id]; persistLocal(); return Promise.resolve();
}
function putTrx(t){
  var c = clone(t);
  if(db) return tmo(db.collection('transaksi').doc(c.id).set(c));
  S.trx.unshift(c); persistLocal(); return Promise.resolve();
}
function putExp(x){
  var c = clone(x);
  if(db) return tmo(db.collection('pengeluaran').doc(c.id).set(c));
  S.exp.unshift(c); persistLocal(); return Promise.resolve();
}
function delExp(id){
  if(db) return db.collection('pengeluaran').doc(id).delete();
  S.exp = S.exp.filter(function(x){ return x.id!==id; }); persistLocal(); return Promise.resolve();
}
function delTrx(id){
  if(db) return db.collection('transaksi').doc(id).delete();
  S.trx = S.trx.filter(function(x){ return x.id!==id; }); persistLocal(); return Promise.resolve();
}
function putLibur(x){
  var c = clone(x);
  if(db) return tmo(db.collection('libur').doc(c.id).set(c));
  var i = S.libur.map(function(y){ return y.id; }).indexOf(c.id);
  if(i>-1) S.libur[i]=c; else S.libur.push(c);
  persistLocal(); return Promise.resolve();
}
function delLibur(id){

function tmo(p){
  return new Promise(function(res,rej){
    var t = setTimeout(function(){ rej({code:'timeout'}); }, 15000);
    p.then(function(v){ clearTimeout(t); res(v); }, function(e){ clearTimeout(t); rej(e); });
  });
}
function errMsg(e){
  var c = e && e.code;
  if(c==='timeout') return 'Belum terhubung ke cloud. Cek tabel dulu, data mungkin masih menunggu terkirim, jangan langsung diulang.';
  if(c==='permission-denied') return 'Tidak punya izin menyimpan (permission-denied). Pastikan login sebagai admin dan ID dokumen di collection admins sama dengan UID akun.';
  if(c==='invalid_argument') return 'Data tidak bisa disimpan. Akun ini perlu akses Contributor atau Editor.';
  if(c==='quota_exceeded') return 'Penyimpanan penuh. Hapus data lama lalu coba lagi.';
  if(c==='revoked') return 'Akses ke penyimpanan dicabut. Muat ulang halaman.';
  return 'Gagal menyimpan ('+(c||'tanpa kode')+'). Periksa koneksi lalu coba lagi.';
}

function startDb(){
  var gotM=false, gotT=false;
  var timer = setTimeout(function(){ S.slow=true; render(); },10000);
  function check(snap, which){
    if(which==='m') gotM=true; else gotT=true;
    if(gotM&&gotT) S.loading=false;
    if(!snap.metadata.fromCache){ S.slow=false; clearTimeout(timer); }
  }
  function onErr(e){ S.dbErr=(e&&e.code)||'unavailable'; S.loading=false; clearTimeout(timer); render(); }
  db.collection('members').onSnapshot(function(snap){
    var m={}; snap.docs.forEach(function(d){ var x=Object.assign({},d.data()); x.id=d.id; m[d.id]=x; });
    S.members=m; check(snap,'m'); render();
  }, onErr);
  db.collection('pengeluaran').onSnapshot(function(snap){
    S.exp = snap.docs.map(function(d){ var x=Object.assign({},d.data()); x.id=d.id; return x; })
      .sort(function(a,b){ return a.at<b.at?1:(a.at>b.at?-1:0); });
    render();
  }, onErr);
  db.collection('antrean').onSnapshot(function(snap){
    S.q = snap.docs.map(function(d){ var x=Object.assign({},d.data()); x.id=d.id; return x; });
    render();
  }, onErr);
  db.collection('transaksi').orderBy('at','desc').limit(1000).onSnapshot(function(snap){
    S.trx = snap.docs.map(function(d){ var x=Object.assign({},d.data()); x.id=d.id; return x; });
    check(snap,'t'); render();
  }, onErr);
}

/* ---------- Perhitungan kasir ---------- */
function calcCart(){
  var c = S.cart;
  var m = c.memberId ? S.members[c.memberId] : null;
  var invalid = false;
  var items = Object.keys(c.items).map(function(id){
    var it = CAT[id], q = c.items[id], unit = it.harga, hm = false, bad = false;
    if(it.mulai){
      var raw = c.hargaIn[id];
      if(raw){ var p = parseInt(raw,10)||0; if(p<it.harga) bad = true; else unit = p; }
    }
    if(m && it.hargaMember!=null){ unit = it.hargaMember; hm = true; }
    if(bad) invalid = true;
    return {id:id, nama:it.nama, harga:unit, jenis:it.jenis, qty:q, sub:unit*q, hm:hm, mulai:!!it.mulai, bad:bad, dasar:it.harga};
  });
  (c.manual||[]).forEach(function(m){
    items.push({id:'manual', key:m.id, nama:m.nama, harga:m.harga, jenis:'produk', qty:1, sub:m.harga, hm:false, mulai:false, bad:false, dasar:m.harga, manual:true});
  });
  var subtotal = sum(items,function(i){ return i.sub; });
  var subLayanan = sum(items.filter(function(i){ return i.jenis==='layanan' && !i.hm; }),function(i){ return i.sub; });
  var tier = m ? tierOf(m.totalBelanja||0) : null;
  var diskon = m ? Math.round(subLayanan*tier.diskon/100) : 0;
  var setelah = subtotal - diskon;
  var maxTukar = m ? Math.max(0, Math.min(Math.floor((m.poin||0)/TUKAR_POIN), Math.floor(setelah/TUKAR_NILAI))) : 0;
  var tukar = Math.min(c.tukar, maxTukar);
  var potPoin = tukar*TUKAR_NILAI;
  var total = setelah - potPoin;
  var poinDapat = m ? Math.floor(total/POIN_PER) : 0;
  var bayar = c.metode==='tunai' ? (parseInt(c.bayar,10)||0) : total;
  return {items:items, count:sum(items,function(i){return i.qty;}), subtotal:subtotal, member:m, tier:tier, diskon:diskon,
          maxTukar:maxTukar, tukar:tukar, potPoin:potPoin, total:total, poinDapat:poinDapat, bayar:bayar, kembali:bayar-total, invalid:invalid};
}
function trxDate(){
  var now = new Date(), today = dayKey(now), t = S.trxTgl || today;
  if(t>=today) return now;
  var p = t.split('-');
  return new Date(+p[0], +p[1]-1, +p[2], now.getHours(), now.getMinutes(), now.getSeconds());
}
function invoiceNo(d){
  var key = dayKey(d);
  var n = S.trx.filter(function(t){ return dayKey(t.at)===key; }).length + 1;
  return 'RB-'+String(d.getFullYear()).slice(2)+pad2(d.getMonth()+1)+pad2(d.getDate())+'-'+String(n).padStart(3,'0');
}
function resetCart(){ S.cart = {items:{}, hargaIn:{}, manual:[], memberId:null, kapster:S.cart.kapster, metode:'tunai', tukar:0, bayar:''}; S.mq=''; }

function bayarSekarang(){
  var k = calcCart();
  if(!k.items.length || S.saving || k.invalid) return;
  if(S.cart.metode==='tunai' && k.bayar<k.total){ toast('Uang diterima kurang dari total.'); return; }
  S.saving = true; render();
  var now = trxDate();
  var t = {
    id:newId(), no:invoiceNo(now), at:now.toISOString(),
    memberId:k.member?k.member.id:null, memberNama:k.member?k.member.nama:'Umum',
    tier:k.tier?k.tier.key:null, diskonPersen:k.tier?k.tier.diskon:0,
    kapster:S.cart.kapster,
    items:k.items.map(function(i){ return {id:i.id,nama:i.nama,harga:i.harga,qty:i.qty,jenis:i.jenis,hm:i.hm}; }),
    subtotal:k.subtotal, diskon:k.diskon, poinDipakai:k.tukar*TUKAR_POIN, potPoin:k.potPoin,
    total:k.total, metode:S.cart.metode, bayar:k.bayar, kembali:Math.max(0,k.kembali), poinDapat:k.poinDapat
  };
  putTrx(t).then(function(){
    if(!k.member) return;
    var m = clone(k.member);
    m.poin = (m.poin||0) - t.poinDipakai + t.poinDapat;
    m.totalBelanja = (m.totalBelanja||0) + t.total;
    m.kunjungan = (m.kunjungan||0) + 1;
    m.terakhir = (m.terakhir && m.terakhir>t.at) ? m.terakhir : t.at;
    return putMember(m);
  }).then(function(){
    var qid=S.cart.qid; S.saving=false; resetCart(); if(qid) setQ(qid,'selesai');
    S.modal = {type:'struk', t:t, baru:true}; S.focusModal=true;
    toast('Pembayaran tersimpan.'); render();
  }).catch(function(e){
    S.saving=false; toast(errMsg(e)); render();
  });
}

  L.push(ln('Pelanggan',t.memberNama)); L.push(ln('Kapster',t.kapster));

  t.items.forEach(function(i){
    L.push(i.nama);

/* ---------- Riwayat ---------- */
function inRange(t){
  var d = new Date(t.at), now = new Date();
  if(S.range==='hari') return dayKey(d)===dayKey(now);
  if(S.range==='7'){ var s=new Date(now.getFullYear(),now.getMonth(),now.getDate()-6); return d>=s; }
  if(S.range==='bulan') return d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth();
  return true;
}
var RANGES = [{k:'hari',n:'Hari ini'},{k:'7',n:'7 hari'},{k:'bulan',n:'Bulan ini'},{k:'semua',n:'Semua'}];
function summarize(list){
  var byM={}, byK={}, byI={};
  list.forEach(function(t){
    byM[t.metode]=(byM[t.metode]||0)+t.total;
    byK[t.kapster]=(byK[t.kapster]||0)+t.total;
    t.items.forEach(function(i){
      var x = byI[i.id] || (byI[i.id]={nama:i.nama,qty:0,omzet:0});
      x.qty+=i.qty; x.omzet+=i.qty*i.harga;
    });
  });
  var total = sum(list,function(t){return t.total;});
  return {total:total, n:list.length, avg:list.length?total/list.length:0,
    member:list.filter(function(t){return t.memberId;}).length, byM:byM, byK:byK,
    items:Object.keys(byI).map(function(k){return byI[k];}).sort(function(a,b){return b.omzet-a.omzet;})};
}
function barList(obj,labelFn){
  var keys = Object.keys(obj).sort(function(a,b){return obj[b]-obj[a];});
  if(!keys.length) return '<p class="hint mt">Belum ada data.</p>';
  var max = obj[keys[0]]||1;
  return keys.map(function(k){
    return '<div class="barrow"><div class="row between"><span>'+esc(labelFn?labelFn(k):k)+'</span><strong class="num">'+rp(obj[k])+'</strong></div>'+
      '<div class="bar"><i style="width:'+Math.max(3,Math.round(obj[k]/max*100))+'%"></i></div></div>';
  }).join('');
}
function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCsv(){
  var list = S.trx.filter(inRange);
  if(!list.length){ toast('Belum ada transaksi pada rentang ini.'); return; }
  var rows = [['No','Waktu','Pelanggan','Kapster','Item','Subtotal','Diskon member','Potongan poin','Total','Metode']];
  list.forEach(function(t){
    rows.push([t.no,fmtWaktu(t.at),t.memberNama,t.kapster,
      t.items.map(function(i){return i.qty+'x '+i.nama;}).join('; '),
      t.subtotal,t.diskon,t.potPoin,t.total,t.metode]);
  });
  var csv = '﻿'+rows.map(function(r){return r.map(csvCell).join(',');}).join('\r\n');
  if(!(window.claude && window.claude.use)){
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
    a.download = 'transaksi-'+dayKey(new Date())+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    toast('File CSV diunduh.'); return;
  }
  window.claude.use('downloads').then(function(dl){
    if(!dl){ toast('Ekspor belum tersedia di tampilan ini.'); return; }
    return dl.save({filename:'transaksi-'+dayKey(new Date())+'.csv', data:csv}).then(function(){ toast('File CSV disimpan.'); });
  }).catch(function(e){ if(!e||e.code!=='declined') toast('Ekspor gagal.'); });
}

function tambahAntrean(){
  var f = S.qf, nama = (f.nama||'').trim(), hp = f.hp ? normHp(f.hp) : '';
  if(!nama){ S.qErr='Isi nama pelanggan.'; return render(); }
  if(hp && !hpOk(hp)){ S.qErr='Nomor HP tidak valid. Contoh: 081234567890.'; return render(); }
  var lb = f.kapster ? liburOn(f.kapster, S.qDate) : null;
  if(lb){ S.qErr = f.kapster+' libur pada tanggal ini'+(lb.ket?' ('+lb.ket+')':'')+'. Pilih kapster lain atau ganti tanggal.'; return render(); }
  if(f.jam && f.kapster && (S.role==='admin'?S.q:S.pub).some(function(x){ return x.tgl===S.qDate && x.jam===f.jam && x.kapster===f.kapster && x.status!=='batal' && x.status!=='selesai'; })){
    S.qErr = f.kapster+' sudah ada booking jam '+f.jam+'.'; return render();
  }
  var n = (S.role==='admin'?S.q:S.pub).filter(function(x){ return x.tgl===S.qDate; }).length + 1;
  var x = {id:newId(), no:'A'+String(n).padStart(2,'0'), at:new Date().toISOString(), tgl:S.qDate, nama:nama, hp:hp, kapster:f.kapster||'', ket:(f.ket||'').trim(), jam:f.jam||'', status:'menunggu'};
  S.qErr=''; S.saving=true; render();
  (S.role==='admin'?putQ(x):createPub(x)).then(function(){ S.saving=false; S.qf={nama:'',hp:'',kapster:'',ket:'',jam:''}; toast(x.nama+' masuk antrean '+x.no+'.'); render(); })
  .catch(function(e){ S.saving=false; S.qErr=errMsg(e); render(); });
}

var app = document.getElementById('app');
function localData(){
  var m = lsGet('rb_members')||{}, t = lsGet('rb_trx')||[], e = lsGet('rb_exp')||[], q = lsGet('rb_q')||[];
  return {members:Object.keys(m).map(function(k){ return m[k]; }), trx:t, exp:e, q:q};
}
function importBanner(){
  if(S.role!=='admin' || S.mode!=='db' || lsGet('rb_imported') || lsGet('rb_import_skip')) return '';
  var d = localData();
  if(!d.members.length && !d.trx.length && !d.exp.length && !d.q.length) return '';
  return '<div class="card pad stack" style="margin-bottom:14px"><h2>Ada data lama di browser ini</h2>'+
    '<p>'+d.members.length+' member, '+d.trx.length+' transaksi, '+d.exp.length+' pengeluaran, '+d.q.length+' antrean. Data ini belum ada di cloud.</p>'+
    '<div class="row wrapx"><button class="btn primary" data-act="impor"'+(S.saving?' disabled':'')+'>'+(S.saving?'Memindahkan…':'Pindahkan ke cloud')+'</button>'+
    '<button class="btn" data-act="impor-skip">Abaikan</button></div></div>';
}
function importLocal(){
  var d = localData(), ops = [];
  d.members.forEach(function(m){ if(m && m.id) ops.push(db.collection('members').doc(m.id).set(clone(m))); });
  d.trx.forEach(function(t){ if(t && t.id) ops.push(db.collection('transaksi').doc(t.id).set(clone(t))); });
  d.exp.forEach(function(x){ if(x && x.id) ops.push(db.collection('pengeluaran').doc(x.id).set(clone(x))); });
  d.q.forEach(function(x){ if(x && x.id){ var c=clone(x); ops.push(db.collection('antrean').doc(c.id).set(c)); ops.push(db.collection('antrean_publik').doc(c.id).set(pubOf(c))); } });
  S.saving=true; render();
  Promise.all(ops).then(function(){ lsSet('rb_imported',true); S.saving=false; toast('Data lama berhasil dipindahkan ke cloud.'); render(); })
  .catch(function(e){ S.saving=false; toast(errMsg(e)); render(); });
}
function render(){
  var ae = document.activeElement, keep = null;
  if(ae && ae.id && app.contains(ae)){
    keep = {id:ae.id, s:null, e:null};
    try{ keep.s = ae.selectionStart; keep.e = ae.selectionEnd; }catch(x){}
  }
  var body = S.role!=='admin' ? viewCust() : S.view==='member' ? viewMember() : S.view==='antrean' ? viewAntrean() : S.view==='libur' ? viewLibur() : S.view==='riwayat' ? viewRiwayat() : S.view==='pengeluaran' ? viewPengeluaran() : S.view==='cek-poin' ? viewCek() : viewKasir();
  app.innerHTML = header() + importBanner() + body + modalHtml();
  if(S.focusModal){
    S.focusModal = false;
    var f = app.querySelector('.dialog input, .dialog button.primary, .dialog button');
    if(f) f.focus();
  } else if(keep){
    var el = document.getElementById(keep.id);
    if(el){
      el.focus();
      try{
        if(el.dataset.end) el.setSelectionRange(el.value.length, el.value.length);
        else if(keep.s!=null) el.setSelectionRange(keep.s, keep.e);
      }catch(x){}
    }
  }
}
function toast(msg,ms){
  var box = document.getElementById('toast'), d = document.createElement('div');
  d.textContent = msg; box.appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, ms||2600);
}
function openModal(m){ S.modal=m; S.formErr=''; S.focusModal=true; render(); }
function closeModal(){ S.modal=null; S.form={}; S.formErr=''; render(); }

/* ---------- Aksi ---------- */
function doLogin(){
  var a = S.auth;
  if(!a.email.trim() || !a.pass){ S.authErr='Isi email dan kata sandi.'; return render(); }
  S.saving=true; S.authErr=''; render();
  firebase.auth().signInWithEmailAndPassword(a.email.trim(), a.pass).catch(function(){ S.saving=false; S.authErr='Email atau kata sandi salah.'; render(); });
}
function doLogout(){ firebase.auth().signOut().then(function(){ try{ history.replaceState(null,'',location.pathname); }catch(e){} location.reload(); }); }
function simpanBaru(){
  var f=S.form, nama=(f.nama||'').trim(), id=normHp(f.hp);
  if(!nama){ S.formErr='Isi nama member.'; return render(); }
  if(!hpOk(id)){ S.formErr='Nomor HP tidak valid. Contoh: 081234567890.'; return render(); }
  if(S.members[id]){ S.formErr='Nomor ini sudah terdaftar atas nama '+S.members[id].nama+'.'; return render(); }
  S.saving=true; S.formErr=''; render();
  putMember({id:id,nama:nama,hp:id,catatan:(f.catatan||'').trim(),poin:0,totalBelanja:0,kunjungan:0,terakhir:null,dibuat:new Date().toISOString()})
  .then(function(){
    S.saving=false; S.modal=null; S.form={};
    if(S.view==='kasir'){ S.cart.memberId=id; S.mq=''; }
    toast('Member '+nama+' terdaftar.'); render();
  }).catch(function(e){ S.saving=false; S.formErr=errMsg(e); render(); });
}
function simpanDetail(){
  var m = S.members[S.modal.id]; if(!m) return;
  var nama = (S.form.nama!=null?S.form.nama:m.nama).trim();
  if(!nama){ S.formErr='Nama tidak boleh kosong.'; return render(); }
  var n = clone(m); n.nama=nama; n.catatan=(S.form.catatan!=null?S.form.catatan:(m.catatan||'')).trim();
  S.saving=true; render();
  putMember(n).then(function(){ S.saving=false; S.modal=null; S.form={}; toast('Perubahan disimpan.'); render(); })
  .catch(function(e){ S.saving=false; S.formErr=errMsg(e); render(); });
}
function hapusMember(){
  var id = S.modal.id;
  delMember(id).then(function(){
    if(S.cart.memberId===id) S.cart.memberId=null;
    S.modal=null; S.form={}; toast('Member dihapus.'); render();
  }).catch(function(e){ S.formErr=errMsg(e); render(); });
}
function salin(id){
  var t = (S.modal && S.modal.t) || S.trx.filter(function(x){return x.id===id;})[0]; if(!t) return;
  var txt = strukText(t);
  function fallback(){
    var el = document.getElementById('struk-text');
    if(el){ var r=document.createRange(); r.selectNodeContents(el); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); }
    toast('Teks struk terpilih. Salin dengan Ctrl+C atau tahan lama.');
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ toast('Struk disalin.'); }, fallback);
    } else fallback();
  }catch(e){ fallback(); }
}

function openKonfirm(o){
  S.modal = Object.assign({type:'konfirm'}, o); S.formErr=''; S.focusModal=true; render();
}
function hapusTrxList(list){
  var fix = {}, ids = list.map(function(t){ return t.id; });
  list.forEach(function(t){
    if(!t.memberId) return;
    var f = fix[t.memberId] || (fix[t.memberId]={poin:0,belanja:0,kunj:0});
    f.poin += (t.poinDapat||0) - (t.poinDipakai||0);
    f.belanja += t.total||0;
    f.kunj += 1;
  });
  var chain = Promise.resolve();
  list.forEach(function(t){ chain = chain.then(function(){ return delTrx(t.id); }); });
  return chain.then(function(){
    var p = Promise.resolve();
    Object.keys(fix).forEach(function(mid){
      var m = S.members[mid]; if(!m) return;
      var f = fix[mid], n = clone(m);
      n.poin = Math.max(0,(m.poin||0)-f.poin);
      n.totalBelanja = Math.max(0,(m.totalBelanja||0)-f.belanja);
      n.kunjungan = Math.max(0,(m.kunjungan||0)-f.kunj);
      var sisa = S.trx.filter(function(t){ return t.memberId===mid && ids.indexOf(t.id)<0; });
      n.terakhir = sisa.length ? sisa.reduce(function(a,t){ return t.at>a?t.at:a; }, '') : null;
      p = p.then(function(){ return putMember(n); });
    });
    return p;
  });
}
function konfirmOk(){
  var M = S.modal; if(!M || S.saving) return;
  S.saving = true; S.formErr=''; render();
  var p;
  if(M.run==='trx'){
    var t = S.trx.filter(function(x){ return x.id===M.id; })[0];
    p = t ? hapusTrxList([t]) : Promise.resolve();
  } else if(M.run==='semua'){
    p = hapusTrxList(S.trx.filter(inRange));
  } else {
    p = delExp(M.id);
  }
  p.then(function(){ S.saving=false; S.modal=null; toast('Data dihapus.'); render(); })
   .catch(function(e){ S.saving=false; S.formErr=errMsg(e); render(); });
}
function simpanEx(){
  var e = S.ex, jml = parseInt(e.jumlah,10)||0;
  var p = (e.tgl||'').split('-'), now = new Date();
  var d = p.length===3 ? new Date(+p[0], +p[1]-1, +p[2], now.getHours(), now.getMinutes()) : null;
  if(!d || isNaN(d.getTime())){ S.exErr='Pilih tanggal pengeluaran.'; return render(); }
  if(!(e.oleh||'').trim()){ S.exErr='Isi nama yang mengeluarkan uang.'; return render(); }
  if(jml<=0){ S.exErr='Isi jumlah pengeluaran.'; return render(); }
  S.saving=true; S.exErr=''; render();
  putExp({id:newId(), at:d.toISOString(), kategori:e.kategori, oleh:(e.oleh||'').trim(), ket:(e.ket||'').trim(), jumlah:jml})
  .then(function(){
    S.saving=false; S.ex={tgl:e.tgl, kategori:e.kategori, oleh:'', ket:'', jumlah:''};
    toast('Pengeluaran '+rp(jml)+' dicatat.'); render();
  }).catch(function(er){ S.saving=false; S.exErr=errMsg(er); render(); });
}

var ACTIONS = {
  add:function(d){ var q=S.cart.items[d.id]||0; if(q<99) S.cart.items[d.id]=q+1; render(); },
  inc:function(d){ var q=S.cart.items[d.id]||0; if(q<99) S.cart.items[d.id]=q+1; render(); },
  dec:function(d){ var q=(S.cart.items[d.id]||0)-1; if(q<=0){ delete S.cart.items[d.id]; delete S.cart.hargaIn[d.id]; } else S.cart.items[d.id]=q; render(); },
  kosong:function(){ S.cart.items={}; S.cart.hargaIn={}; S.cart.manual=[]; S.cart.tukar=0; S.cart.bayar=''; render(); },
  filter:function(d){ S.filter=d.v; render(); },
  'pilih-member':function(d){ S.cart.memberId=d.id; S.cart.tukar=0; S.mq=''; render(); },
  'ganti-member':function(){ S.cart.memberId=null; S.cart.tukar=0; render(); },
  'member-dari-cari':function(){
    var q=S.mq.trim(), isNum=/^[\d+\s-]+$/.test(q);
    S.form = {nama:isNum?'':q, hp:isNum?q:'', catatan:''}; openModal({type:'baru'});
  },
  metode:function(d){ S.cart.metode=d.v; render(); },
  'tukar+':function(){ var k=calcCart(); if(k.tukar<k.maxTukar){ S.cart.tukar=k.tukar+1; } render(); },
  'tukar-':function(){ var k=calcCart(); S.cart.tukar=Math.max(0,k.tukar-1); render(); },
  uang:function(d){ var k=calcCart(); S.cart.bayar = d.v==='pas' ? String(k.total) : d.v; render(); },
  bayar:bayarSekarang,
  'to-cart':function(){ var c=document.getElementById('cart'); if(c) c.scrollIntoView({behavior:'smooth',block:'start'}); },
  modal:function(d){
    if(d.type==='baru'){ S.form={nama:'',hp:'',catatan:''}; openModal({type:'baru'}); }
    else if(d.type==='member'){ S.form={}; openModal({type:'member',id:d.id}); }
    else if(d.type==='struk'){ openModal({type:'struk',id:d.id}); }
  },
  close:closeModal,
  overlay:function(d,el,e){ if(e.target===el) closeModal(); },
  'simpan-baru':simpanBaru,
  'simpan-detail':simpanDetail,
  'hapus-tanya':function(){ S.modal.confirm=true; S.formErr=''; render(); },
  'hapus-batal':function(){ S.modal.confirm=false; S.formErr=''; render(); },
  'hapus-ok':hapusMember,
  salin:function(d){ salin(d.id); },
  range:function(d){ S.range=d.v; render(); },
  'tanya-hapus-trx':function(d){
    var t = S.trx.filter(function(x){ return x.id===d.id; })[0]; if(!t) return;
    openKonfirm({judul:'Hapus transaksi?', pesan:t.no+' · '+t.memberNama+' · '+rp(t.total)+'. '+(t.memberId?'Poin dan total belanja member dikembalikan seperti sebelum transaksi ini. ':'')+'Data tidak bisa dikembalikan.', tombol:'Ya, hapus', run:'trx', id:d.id});
  },
  'tanya-hapus-semua':function(){
    var list = S.trx.filter(inRange); if(!list.length) return;
    var r = RANGES.filter(function(x){ return x.k===S.range; })[0];
    openKonfirm({judul:'Hapus '+list.length+' transaksi?', pesan:'Semua transaksi pada rentang "'+r.n+'" akan dihapus. Poin dan total belanja member dikembalikan sesuai transaksi yang dihapus. Data tidak bisa dikembalikan.', tombol:'Ya, hapus semua', run:'semua'});
  },
  'tanya-hapus-ex':function(d){
    var x = S.exp.filter(function(y){ return y.id===d.id; })[0]; if(!x) return;
    openKonfirm({judul:'Hapus pengeluaran?', pesan:x.kategori+(x.oleh?' · '+x.oleh:'')+(x.ket?' · '+x.ket:'')+' · '+rp(x.jumlah||0)+'. Data tidak bisa dikembalikan.', tombol:'Ya, hapus', run:'ex', id:d.id});
  },
  'konfirm-ok':konfirmOk,
  'simpan-ex':simpanEx,
  'q-kap':function(d){ S.qKap=d.v; render(); },
  nav:function(d,el,e){ e.preventDefault(); go(d.v); },
  'm-tambah':function(){
    var j = parseInt(S.mf.jumlah,10)||0;
    if(j<=0){ S.mErr='Isi nominal lebih dari 0.'; return render(); }
    S.cart.manual = (S.cart.manual||[]).concat([{id:newId(), nama:(S.mf.nama||'').trim()||'Nominal manual', harga:j}]);
    S.mf = {nama:'', jumlah:''}; S.mErr=''; render();
  },
  'm-hapus':function(d){ S.cart.manual = (S.cart.manual||[]).filter(function(m){ return m.id!==d.id; }); render(); },
  'l-tambah':function(){
    var f = S.lf;
    if(!f.mulai || !f.selesai || f.selesai<f.mulai){ S.lErr='Tanggal selesai tidak boleh sebelum tanggal mulai.'; return render(); }
    var x = {id:newId(), kapster:f.kapster, mulai:f.mulai, selesai:f.selesai, ket:(f.ket||'').trim(), at:new Date().toISOString()};
    S.lErr=''; S.saving=true; render();
    putLibur(x).then(function(){ S.saving=false; S.lf.ket=''; toast('Libur '+x.kapster+' tersimpan.'); render(); })
    .catch(function(e){ S.saving=false; S.lErr=errMsg(e); render(); });
  },
  'l-hapus':function(d){ delLibur(d.id).then(function(){ toast('Jadwal libur dihapus.'); render(); }).catch(function(e){ toast(errMsg(e)); }); },
  impor:importLocal,
  'impor-skip':function(){ lsSet('rb_import_skip',true); render(); },
  pasang:pasangApp,
  login:doLogin,
  keluar:doLogout,
  'q-tambah':tambahAntrean,
  'q-status':function(d){ setQ(d.id,d.v).then(render).catch(function(e){ toast(errMsg(e)); }); },
  'q-hapus':function(d){ delQ(d.id).then(function(){ toast('Antrean dihapus.'); render(); }).catch(function(e){ toast(errMsg(e)); }); },
  'q-kasir':function(d){
    var x = S.q.filter(function(y){ return y.id===d.id; })[0]; if(!x) return;
    var kap = x.kapster || S.cart.kapster;
    resetCart(); S.cart.kapster = kap; S.cart.qid = x.id;
    if(x.hp && S.members[x.hp]) S.cart.memberId = x.hp;
    if(x.status==='menunggu') setQ(x.id,'dilayani');
    go('kasir');
  },
  'export':exportCsv
};
app.addEventListener('click',function(e){
  var el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  var fn = ACTIONS[el.dataset.act];
  if(fn) fn(el.dataset, el, e);
});
app.addEventListener('input',function(e){
  var el = e.target, k = el.dataset.in;
  if(el.dataset.form){ S.form[el.dataset.form]=el.value; return; }
  if(el.dataset.l){
    var kl = el.dataset.l;
    if((kl==='mulai'||kl==='selesai') && !el.value) S.lf[kl]=dayKey(new Date()); else S.lf[kl]=el.value;
    if(kl==='mulai' && S.lf.selesai<S.lf.mulai) S.lf.selesai=S.lf.mulai;
    S.lErr='';
    if(kl==='mulai'||kl==='selesai') render();
    return;
  }
  if(el.dataset.m){
    if(el.dataset.m==='jumlah'){ S.mf.jumlah=el.value.replace(/\D/g,'').slice(0,9); S.mErr=''; render(); }
    else { S.mf.nama=el.value; }
    return;
  }
  if(el.dataset.q){ S.qf[el.dataset.q]=el.value; return; }
  if(el.dataset.ex){
    var kx = el.dataset.ex;
    if(kx==='jumlah'){ S.ex.jumlah=el.value.replace(/\D/g,'').slice(0,10); render(); }
    else { S.ex[kx]=el.value; }
    return;
  }
  if(!k) return;
  if(k==='mq'){ S.mq=el.value; render(); }
  else if(k==='ml'){ S.ml=el.value; render(); }
  else if(k==='email'){ S.auth.email=el.value; }
  else if(k==='pass'){ S.auth.pass=el.value; }
  else if(k==='trxtgl'){ S.trxTgl = el.value || dayKey(new Date()); render(); }
  else if(k==='qdate'){ if(el.value){ S.qDate=el.value; render(); } }
  else if(k==='cek'){ S.cek=el.value; render(); }
  else if(k==='kapster'){ S.cart.kapster=el.value; }
  else if(k==='harga'){ S.cart.hargaIn[el.dataset.id]=el.value.replace(/\D/g,'').slice(0,9); render(); }
  else if(k==='bayar'){ S.cart.bayar=el.value.replace(/\D/g,'').slice(0,9); render(); }
});
document.addEventListener('keydown',function(e){ if(e.key==='Escape' && S.modal) closeModal(); if(e.key==='Enter' && e.target.id==='pass') doLogin(); });

/* ---------- Routing & mulai ---------- */
function go(v){ try{ history.replaceState(null,'','#'+v); }catch(e){} S.view=v; render(); window.scrollTo(0,0); }
function route(){
  var h = (location.hash||'').replace('#','');
  S.view = (h==='masuk' && S.role!=='admin') ? 'masuk' : VIEWS.some(function(v){return v.k===h;}) ? h : (S.role==='admin' ? 'kasir' : 'antrean');
  render();
}
window.addEventListener('hashchange',route);
if('serviceWorker' in navigator && location.protocol.indexOf('http')===0){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }

function init(){
  var cfg = window.FIREBASE_CONFIG || {};
  if(!cfg.apiKey || cfg.apiKey==='ISI_DI_SINI' || !window.firebase){
    S.role='admin'; VIEWS=VA; S.mode='local'; loadLocal(); route(); return;
  }
  firebase.initializeApp(cfg);
  db = firebase.firestore(); S.mode='db'; S.role='customer'; VIEWS=VC; route();
  db.collection('antrean_publik').orderBy('at','desc').limit(300).onSnapshot(function(snap){
    S.pub = snap.docs.map(function(d){ var x=Object.assign({},d.data()); x.id=d.id; return x; });
    if(S.role!=='admin') S.loading=false; render();
  }, function(e){ S.dbErr=(e&&e.code)||'unavailable'; S.loading=false; render(); });
  db.collection('libur').onSnapshot(function(snap){
    S.libur = snap.docs.map(function(d){ var x=Object.assign({},d.data()); x.id=d.id; return x; });
    render();
  }, function(){});
  firebase.auth().onAuthStateChanged(function(u){
    if(!u){ firebase.auth().signInAnonymously().catch(function(){}); return; }
    if(u.isAnonymous) return;
    db.collection('admins').doc(u.uid).get().then(function(d){
      if(d.exists){
        if(S.role!=='admin'){ S.role='admin'; VIEWS=VA; S.saving=false; S.loading=true; S.dbErr=null; startDb(); go('kasir'); }
      } else { S.saving=false; S.authErr='Akun ini belum terdaftar sebagai admin.'; firebase.auth().signOut(); render(); }
    }).catch(function(){ S.saving=false; S.authErr='Gagal memeriksa akses admin.'; render(); });
  });
}
init();
})();
</script>
